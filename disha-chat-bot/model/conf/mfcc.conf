# config for high-resolution MFCC features, intended for neural network training
# Note: we keep all cepstra, so it has the same info as filterbank features,
# but MFCC is more easily compressible (because less correlated) which is why 
# we prefer this method.
#--use-energy=false	# use average of log energy, not energy.
#--sample-frequency=8000	# sampled at 8kHz
#--num-mel-bins=20	# similar to Google's setup.
#--num-ceps=20		# there is no dimensionality reduction.
#--low-freq=60		# low cutoff frequency for mel bins... this is high-bandwidth data, so
#			# there might be some information at the low end.
#--high-freq=3700	# high cutoff frequently, relative to Nyquist of 8000 (=7600) 
#
--use-energy=false
--num-mel-bins=40
--num-ceps=40
--low-freq=20
--high-freq=-400
--sample-frequency=8000
--allow-downsample=true
