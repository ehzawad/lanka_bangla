<html lang="en">

<head>
    <title>Chatbot Widget</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale = 1.0, user-scalable=no" />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta content="utf-8" http-equiv="encoding" />
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="57x57" href="static/img/favicons/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="static/img/favicons/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="static/img/favicons/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="static/img/favicons/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="static/img/favicons/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="static/img/favicons/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="static/img/favicons/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="static/img/favicons/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="static/img/favicons/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="static/img/favicons/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="static/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="static/img/favicons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/img/favicons/favicon-16x16.png">
    <!-- End Favicon -->
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Raleway:500&display=swap" rel="stylesheet" />

    <!--Import Font Awesome Icon Font-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        integrity="sha256-eZrrJcwDc/3uDhsdt61sL2oOBY362qM3lon1gyExkL0=" crossorigin="anonymous" />

    <!--Import materialize.css-->
    <link rel="stylesheet" type="text/css" href="static/css/materialize.min.css" />

    <!--Main css-->
    <link rel="stylesheet" type="text/css" href="static/css/style.css" />


</head>

<body>
    <div class="g-brand-logo">
        <img width="150" src="static/img/gplex-ai.svg" alt="">
    </div>


    <div class="g-text-animation">
        <div class="line">
            Experience the future
        </div>

        <div class="line">
            Seamless conversations
        </div>

        <div class="line">
            Say hello to the future of AI-driven communication
        </div>

        <div class="line">
            Get ready for a chatbot like never before
        </div>
    </div>


    <div class="container">
        <!-- Modal for rendering the charts, declare this if you want to render charts,
       else you remove the modal -->
        <div id="modal1" class="modal">
            <canvas id="modal-chart"></canvas>
        </div>

        <!--chatbot widget -->
        <div class="widget">
            <div class="chat_header">

                <!--Add the name of the bot here -->
                <span class="chat_header_title"> <img width="35" src="static/img/disha.svg" alt=""> DISHA</span>


                <div class="g-right-close-area">
                    <span class="dropdown-trigger" href="#" data-target="dropdown1">
                        <i class="material-icons"> more_vert </i>
                    </span>

                    <!-- Dropdown menu-->
                    <ul id="dropdown1" class="dropdown-content">
                        <li><a href="#" id="clear">Clear</a></li>
                        <li><a href="#" id="restart">Restart</a></li>
                    </ul>

                    <div> <span id="close">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#ffffff"
                                class="bi bi-x" viewBox="0 0 16 16">
                                <path
                                    d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z" />
                            </svg>
                        </span></div>
                </div>

            </div>

            <!--Chatbot contents goes here -->
            <div class="chats" id="chats">
                <div class="clearfix"></div>
            </div>

            <!--keypad for user to type the message -->
            <div class="keypad">
                <textarea id="userInput" placeholder="Type a message..." class="usrInput"></textarea>
                <div id="sendButton">
                    <i id="fa-microphone" class="fa fa-microphone" aria-hidden="true"></i>
                </div>
                <div class="loader" style="display: none;"></div>

            </div>

            <div class="g-powered-by">
                <small>Powered by <strong><span>g</span>Plex</strong></small>
            </div>

        </div>

        <!--bot profile-->
        <div class="profile_div" id="profile_div">
            <img class="imgProfile" src="static/img/disha.svg" alt="gplex ai" />
        </div>

        <!-- Bot pop-up intro -->
        <div class="tap-target" data-target="profile_div">
            <div class="tap-target-content">
                <h5 class="white-text">Hey there 👋</h5>
                <p class="white-text">
                    I can help you get started with gPlex AI and answer your technical
                    questions.
                </p>
            </div>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.2/TweenMax.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/SplitText.min.js"></script>
    <!--JavaScript at end of body for optimized loading-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script type="text/javascript" src="static/js/lib/materialize.min.js"></script>
    <script src="static/js/lib/uuid.min.js"></script>
    <!--Main Script -->
    <script type="text/javascript" src="static/js/script.js"></script>

    <!--Chart.js Script -->
    <script type="text/javascript" src="static/js/lib/chart.min.js"></script>
    <script type="text/javascript" src="static/js/lib/showdown.min.js"></script>
    <script type="text/javascript" src="static/client.js"></script>

    <script>
        // Select all elements with class 'line'
        var lines = document.querySelectorAll('.line');

        // Create a TimelineLite instance
        var tl = new TimelineLite({
            onComplete: function () {
                tl.restart();
            }
        });

        // Set default ease
        TweenLite.defaultEase = Circ.easeInOut;

        // Define time and y values
        var time = 1.1;
        var y = 100;

        // Create animation using pure JavaScript
        tl
            .add(function () {
                lines.forEach(function (line, index) {
                    var delay = index * 2 * time;

                    // Initial animation
                    TweenMax.fromTo(line, time, {
                        opacity: 0,
                        y: y,
                    }, {
                        opacity: 1,
                        y: 0,
                        delay: delay,
                    });

                    // Reverse animation
                    TweenMax.to(line, time, {
                        opacity: 0,
                        y: -y,
                        delay: delay + 1.3,
                    });
                });
            });

    </script>

    <script src="static/js/animate.js"></script>
</body>

</html>
