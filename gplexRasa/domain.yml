    custom:
      payload: quickReplies
      data:
      - title: Yes
        payload: /product_information
      - title: No
        payload: /service_feedback
  utter_atStart:
  - custom:
      payload: buttonsPayload
      data:
        text: Hello, how can I help you?</br> Please read and agree to the terms and condition
        buttons:
        - title: Read privacy policy
          type: urlLink
          url: https://www.lankabangla.com/privacy-policy/
          payload: /read_privacy_policy
