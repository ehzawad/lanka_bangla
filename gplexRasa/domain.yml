  utter_atStart:
  - custom:
      payload: "buttonsPayload"
      data:
        type: "quickrepliesbuttons"
        text: "Hi there, Welcome to Lanka Bangla! Nice to meet you. I'd love to help you out: What would you like to know? Choose one of the options below:"
        buttons:
          - title: "Read privacy policy"
            type: "urlLink"
            url: "https://www.lankabangla.com/privacy-policy/"
            payload: "/read_privacy_policy"
          - title: "Agree"
            payload: "/main_node"
          - title: "Disagree"
            payload: "/product_information"


  utter_loan:
  - custom:
      payload: "buttonsPayload"
      data:
        type: "quickrepliesbuttons"
        text: "thank you for being with lankabangla. Surely I can help you. For your loan information, we need to check your identity first. Please choose SMS or email to get the OTP"
        buttons:
          - title: "SMS"
            payload: "/loan_sms"
          - title: "Email"
            payload: "/loan_email"


  
  
