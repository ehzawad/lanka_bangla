forms:
  otp_sms_form:
    required_slots:
    - otp_sender_sms
    - otp
slots:
  otp_sender_sms:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
      - active_loop: otp_sms_form
        requested_slot: otp_sender_sms
  otp:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
      - active_loop: otp_sms_form
        requested_slot: otp


  otp_verified:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
    - type: custom


  service_type:
    type: text
    influence_conversation: true
    mappings:
    - type: custom


actions:
- action_options1
- action_print_info
- utter_submit
- utter_slots_values
- action_custom_fallback
- action_options2
- action_options3
- action_options4
- utter_greet
- validate_otp_sms_form
- action_reset_otp_form_slots
- action_service_type_credit_card
- action_service_type_deposit
- action_service_type_loan

entities:
- otp
responses:
  utter_ask_otp_sender_sms:
  - text: Please give your mobile number for sending you an OTP?
  utter_ask_otp:
  - text: Please check your six digit OTP?
  #utter_submit:
  #- text: Ok. Thanks!
  #utter_slots_values:
  #- text: I will remember that your name is {otp_sender_sms} {otp}!
  utter_greet:
  - text: Hey! How are you?
  utter_pin_change:
  - text: Thank you for your interest for your pin change request. You can email here at apply_now
  utter_pin_change_text:
  - text: for instant support you may also call our 24/7 Contact Center @ 16325 or +8809611 016325 from Overseas
  utter_pin_change_quick_replies:
  - text: I hope you have received your expected service. Thank you for allowing me to assist you. Do you need any other support?
    custom:
      payload: quickReplies
      data:
      - title: Yes
        payload: /product_information
      - title: No
        payload: /service_feedback
  utter_chequebook:
  - text: thank you for your interest for your chequebook request.
  utter_chequebook_quick_replies:
  - text: 'Please select your card type:'
    custom:
      payload: quickReplies
      data:
      - title: Mastercard
        payload: /mastercard_chequebook
      - title: VISA card
        payload: /visacard_chequebook
      - title: Shikha Card
        payload: /shikhacard_chequebook
  utter_lankabangla_management:
  - custom:
      payload: buttonsPayload
      data:
        text: LankaBangla Management
        buttons:
        - title: Board of Directors
          type: urlLink
          url: https://www.lankabangla.com/board-of-directors/
          payload: /board_of_directors
        - title: Management Committee
          type: urlLink
          url: https://www.lankabangla.com/management-team/
          payload: /management_team
        - title: Managing directors & CEO
          type: urlLink
          url: https://www.lankabangla.com/
          payload: /managing_directors_committee
        - title: Go back
          payload: /greet
  utter_mastercard_BEFTN:
  - text: Now you can transfer mastercard_BEFTN limit to your own Bank account through BEFTN
  utter_mastercard_BEFTN_buttons:
  - text: For instant support you may also call our 24/7 Contact Center @ 16325 or +8809611 016325 from Overseas
    buttons:
    - title: BEFTN registration
      type: urlLink
      url: https://www.lankabangla.com/BEFTN_registration
      payload: /BEFTN_registration
  utter_mastercard_BEFTN_quick_replies:
  - text: I hope you have received your expected service. Thank you for allowing me to assist you. Do you need any other support?
    custom:
      payload: quickReplies
      data:
      - title: Yes
        payload: /product_information
      - title: No
        payload: /service_feedback
  utter_apply_for_credit_card:
  - text: You can apply now from our website directly
    buttons:
    - title: Apply Now
      payload: /apply_now
    - title: credit card products
      payload: /credit_card_products
    - title: Go back
      payload: /product_information
  utter_apply_for_deposit:
  - text: You can apply now from our website directly
    buttons:
    - title: Apply Now
      payload: /apply_now
    - title: deposit products
      payload: /deposit_products
    - title: Go back
      payload: /product_information
  utter_apply_for_loan:
