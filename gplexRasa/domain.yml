responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_atStart:
  - text: "Hi there, Welcome to Lanka Bangla! Nice to meet you. I'd love to help you out: What would you like to know? Choose one of the options below:"
    buttons:
    - title: "Read privacy policy"
      payload: "/read_privacy_policy"
    - title: "Agree"
      payload: "/main_node"
    - title: "Disagree"
      payload: "/product_information"
  
  utter_read_privacy_policy:
  - text: "You can read our privacy policy here: https://www.lankabangla.com/privacy-policy/"

  utter_main_node:
  - text: "Please click on Account/General Information & select to see details, and For instant support you may also call our 24/7 Contact Center @ 16325 or +8809611 016325 from Overseas"
    buttons:
    - title: "customer account information"
      payload: "/existing_customer"
    - title: "general information"
      payload: "/new_customer"
    - title: "home"
      payload: "/greet"

  utter_product_information:
  - text: "product information"

  utter_existing_customer:
  - text: "please select your product type"
    buttons:
    - title: "credit card"
      payload: "/credit_card"
    - title: "deposit"
      payload: "/deposit"
    - title: "Loan"
      payload: "/loan"
    - title: "apply now"
      payload: "/apply_now"
    - title: "go back"
      payload: "/main_node"

  utter_new_customer:
  - text: " new customer"
  

  utter_credit_card:
  - text: "You can apply for a credit card here: https://www.lankabangla.com/credit-card/"

  utter_deposit:
  - text: "You can apply for a deposit here: https://www.lankabangla.com/deposit/"

  utter_loan:
  - text: "You can apply for a loan here: https://www.lankabangla.com/loan/"

  utter_apply_now:
  - text: "You can apply now here: https://www.lankabangla.com/apply-now/"

  

