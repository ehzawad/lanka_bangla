version: '3.1'
intents:
- BEFTN_registration_link
- LBFL_offers
- about_lankabangla
- apply_for_credit_card
- apply_for_deposit
- apply_for_loan
- apply_now
- board_of_directors
- branches
- card_product_form
- chequebook
- contact_center
- credit_card_email
- credit_card_offers
- credit_card_products
- credit_card_sms
- credit_card_status
- deposit_status
- loan_status
- loan_sms
- deposit
- deposit_sms
- deposit_offers
- deposit_products
- existing_customer
- fee_charges
- greet
- inform
- lankabangla_management
- loan
- loan_products
- main_node
- management_team
- managing_director
- mastercard_BEFTN
- mastercard_chequebook
